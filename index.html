<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionCraft AI | Dashboard Clean</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121218;
            --card-bg: #1c1c24;
            --accent-pink: #ff4d94;
            --accent-purple: #8b5cf6;
            --text-main: #ffffff;
            --text-muted: #8e8e9c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- BACKGROUND ORBS --- */
        .orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
        }
        .orb-1 { top: 10%; left: 5%; background: #6366f1; }
        .orb-2 { bottom: 5%; right: 10%; background: #db2777; }

        /* --- DASHBOARD --- */
        .dashboard {
            position: relative;
            z-index: 10;
            width: 95vw;
            max-width: 1000px;
            background: var(--bg-dark);
            border-radius: 40px;
            padding: 50px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header {
            text-align: left;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 38px;
            font-weight: 800;
            color: white;
            letter-spacing: -1.5px;
        }

        /* --- GRID --- */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            min-height: 450px;
        }

        /* Centrage des titres de section */
        .panel-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-main);
            text-align: center; /* Centré comme demandé */
        }

        /* --- UPLOAD ZONE --- */
        .drop-zone {
            border: 2px dashed #3f3f46;
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.02);
        }
        .drop-zone:hover { border-color: var(--accent-pink); background: rgba(255, 77, 148, 0.05); }

        .status-box {
            margin-top: auto;
            padding-top: 20px;
        }

        .progress-container {
            height: 12px;
            background: #27272a;
            border-radius: 20px;
            margin: 15px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-pink);
            transition: width 0.4s;
            box-shadow: 0 0 15px rgba(255, 77, 148, 0.4);
        }

        /* --- RESULT ZONE --- */
        .result-preview {
            flex-grow: 1;
            background: #27272a;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #3f3f46;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #resultImage { width: 100%; height: 100%; object-fit: contain; display: none; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-btn {
            background: linear-gradient(90deg, #ff4d94, #8b5cf6);
            border: none;
            color: white;
            padding: 18px; /* Plus grand */
            border-radius: 50px;
            font-weight: 800;
            font-size: 18px; /* Taille augmentée */
            cursor: pointer;
            transition: transform 0.2s;
        }
        .download-btn:hover { transform: translateY(-2px); opacity: 0.95; }

        .reset-btn {
            background: #2d2d39;
            border: none;
            color: var(--text-muted);
            padding: 14px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px; /* Taille augmentée */
            transition: 0.3s;
        }
        .reset-btn:hover { background: #3f3f4e; color: white; }

        @media (max-width: 850px) {
            .content-grid { grid-template-columns: 1fr; }
            .dashboard { height: auto; margin: 20px; padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="dashboard">
        <div class="header">
            <div class="logo">VisionCraft AI</div>
        </div>

        <div class="content-grid">
            <div class="panel">
                <div class="panel-title">Upload Zone</div>
                
                <div class="drop-zone" id="dropArea" onclick="document.getElementById('imageInput').click()">
                    <svg width="40" height="40" fill="none" stroke="#52525b" viewBox="0 0 24 24" style="margin-bottom:15px;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p style="color: var(--text-muted); font-weight: 600;">Drop Image Here</p>
                    <p style="font-size: 12px; color: #52525b; margin-top: 5px;">Supports JPEG and PNG files</p>
                    <input type="file" id="imageInput" accept="image/jpeg,image/png" style="display:none">
                </div>

                <div class="status-box">
                    <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600;">
                        <span id="statusText" style="color:var(--text-muted)">Ready to process</span>
                        <span id="statusPercent" style="color:var(--accent-pink)">0%</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Result Container</div>
                
                <div class="result-preview">
                    <img id="resultImage" src="" alt="Result">
                    <div id="placeholder" style="color:#52525b; font-size: 14px;">Preview will appear here</div>
                </div>

                <div class="btn-group">
                    <button class="download-btn" onclick="downloadImage()">Download</button>
                    <button class="reset-btn" onclick="resetUI()">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // The deployment script replaces only this marker with the Function URL.
        const LAMBDA_URL = '__LAMBDA_FUNCTION_URL__';

        function resetUI() {
            document.getElementById('resultImage').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('statusPercent').innerText = '0%';
            document.getElementById('statusText').innerText = 'Ready to process';
            document.getElementById('imageInput').value = "";
        }

        document.getElementById('imageInput').addEventListener('change', (e) => {
            if (e.target.files.length) handleUpload(e.target.files[0]);
        });

        async function handleUpload(file) {
            const bar = document.getElementById('progressBar');
            const pct = document.getElementById('statusPercent');
            const txt = document.getElementById('statusText');
            
            try {
                if (LAMBDA_URL === '__LAMBDA_FUNCTION_URL__') {
                    throw new Error('The Lambda URL has not been configured.');
                }
                txt.innerText = "Uploading...";
                const res = await fetch(`${LAMBDA_URL}?action=upload&file=${encodeURIComponent(file.name)}`);
                const data = await res.json();
                if (!res.ok || data.status !== 'upload_ready') {
                    throw new Error(data.error || 'Unable to create an upload URL.');
                }
                
                bar.style.width = "30%"; pct.innerText = "30%";
                const upload = await fetch(data.url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'image/jpeg' },
                    body: file
                });
                if (!upload.ok) {
                    throw new Error('Image upload failed.');
                }

                txt.innerText = "AI Analyzing...";
                bar.style.width = "60%"; pct.innerText = "60%";

                let attempts = 0;
                const maxAttempts = 30;
                const interval = setInterval(async () => {
                    attempts++;
                    try {
                        const vRes = await fetch(`${LAMBDA_URL}?action=view&file=${encodeURIComponent(file.name)}`);
                        const vData = await vRes.json();

                        if (vData.status === "ready") {
                            clearInterval(interval);
                            txt.innerText = "Completed";
                            bar.style.width = "100%"; pct.innerText = "100%";
                            document.getElementById('resultImage').src = vData.url + "&t=" + Date.now();
                            document.getElementById('resultImage').style.display = 'block';
                            document.getElementById('placeholder').style.display = 'none';
                        } else if (attempts >= maxAttempts) {
                            clearInterval(interval);
                            txt.innerText = "Processing timed out";
                            bar.style.width = "100%"; pct.innerText = "100%";
                            alert("The image processing did not complete in time. Check the AWS Lambda logs.");
                        }
                    } catch (e) {
                        if (attempts >= maxAttempts) {
                            clearInterval(interval);
                            txt.innerText = "Processing error";
                            bar.style.width = "100%"; pct.innerText = "100%";
                            alert("Unable to check processing status. Please verify the Lambda and S3 configuration.");
                        }
                    }
                }, 2000);
            } catch (e) { alert("Error connecting to AI"); resetUI(); }
        }

        async function downloadImage() {
            const img = document.getElementById('resultImage');
            if (!img.src) return;
            const res = await fetch(img.src);
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "vision-result.jpg";
            a.click();
        }
    </script>
</body>
</html>
